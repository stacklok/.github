name: Check PR Issue Link

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:
    # No inputs needed — the workflow uses the caller's github.token and context.repo automatically.
    # Callers must declare these permissions in their own workflow:
    #   permissions:
    #     pull-requests: write
    #     issues: write
    #
    # This workflow is only callable by repositories in the StacklokLabs organization.
    # Prerequisite: enable "Accessible from repositories in the 'StacklokLabs' organization"
    # in this repo under Settings → Actions → General → Access.

permissions:
  pull-requests: write
  issues: write

concurrency:
  group: pr-issue-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const SENTINEL = '<!-- pr-issue-check-warning -->';
            const LABEL = 'needs-issue-link';
            // Closing keywords: merging the PR auto-closes the referenced issue.
            // Optionally prefixed with an `owner/repo` for cross-repo references
            // (GitHub's native closing keywords only work within the same repo —
            // see the cross-repo handling below).
            const CLOSE_REGEX = /\b(closes|fixes|resolves|close|fix|resolve)\s+(?:([\w.-]+\/[\w.-]+)#|#)(\d+)\b/gi;
            // Non-closing references: link the PR to an issue without auto-closing it.
            // Needed for issues implemented across multiple PRs — using a closing
            // keyword on every one of them would close the issue on the first merge,
            // before the work is actually done. Also optionally prefixed with
            // `owner/repo` for cross-repo references.
            const REF_REGEX = /\b(relates to|related to|part of|refs?|references?|contributes to|follow-?up to)\s+(?:([\w.-]+\/[\w.-]+)#|#)(\d+)\b/gi;

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            async function ensureLabelExists() {
              try {
                await github.rest.issues.createLabel({
                  owner, repo,
                  name: LABEL,
                  color: 'e4e669',
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            async function findExistingWarningComment() {
              for await (const { data: comments } of github.paginate.iterator(
                github.rest.issues.listComments,
                { owner, repo, issue_number: prNumber, per_page: 100 }
              )) {
                const found = comments.find(c => c.body.includes(SENTINEL));
                if (found) return found;
              }
              return null;
            }

            async function upsertComment(body) {
              const existing = await findExistingWarningComment();
              if (existing) {
                await github.rest.issues.updateComment({
                  owner, repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: prNumber,
                  body,
                });
              }
            }

            async function deleteWarningComment() {
              const existing = await findExistingWarningComment();
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner, repo,
                  comment_id: existing.id,
                });
              }
            }

            async function addWarningLabel() {
              try {
                await github.rest.issues.addLabels({
                  owner, repo,
                  issue_number: prNumber,
                  labels: [LABEL],
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            async function removeWarningLabel() {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo,
                  issue_number: prNumber,
                  name: LABEL,
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }

            await ensureLabelExists();

            const body = context.payload.pull_request.body || '';

            // Collapse regex matches into unique { owner, repo, number, isCrossRepo, isClose } references,
            // keyed by "owner/repo#number" so the same target mentioned with both a closing keyword and a
            // non-closing keyword only needs to be validated once (closing wins for the cross-repo warning).
            const refsByKey = new Map();
            function collectMatches(regex, isClose) {
              for (const m of body.matchAll(regex)) {
                const ownerRepo = m[2];
                const number = parseInt(m[3], 10);
                const [refOwner, refRepo] = ownerRepo ? ownerRepo.split('/') : [owner, repo];
                // Owner/repo names are case-insensitive on GitHub. A prefix is only
                // truly "cross-repo" if it names a different repo than context.repo —
                // an explicit same-repo `owner/repo#N` still auto-closes normally.
                const isCrossRepo = Boolean(ownerRepo) &&
                  (refOwner.toLowerCase() !== owner.toLowerCase() || refRepo.toLowerCase() !== repo.toLowerCase());
                const key = `${refOwner.toLowerCase()}/${refRepo.toLowerCase()}#${number}`;
                const existing = refsByKey.get(key);
                if (existing) {
                  existing.isClose = existing.isClose || isClose;
                } else {
                  refsByKey.set(key, { owner: refOwner, repo: refRepo, number, isCrossRepo, isClose });
                }
              }
            }
            collectMatches(CLOSE_REGEX, true);
            collectMatches(REF_REGEX, false);
            const refs = [...refsByKey.values()];

            if (refs.length === 0) {
              await upsertComment(
                `${SENTINEL}\n## Missing Issue Link\n\nThis PR does not appear to reference a GitHub issue.\nPlease add a closing keyword (e.g. \`Closes #123\`) if this PR fully resolves the issue, ` +
                `or a non-closing reference (e.g. \`Part of #123\`) if it's one of several PRs implementing it.\n` +
                `Cross-repo references are also supported (e.g. \`Part of owner/repo#123\`) for issues tracked outside this repository.\n` +
                `Supported closing keywords: closes, fixes, resolves, close, fix, resolve (case insensitive)\n` +
                `Supported non-closing references: relates to, related to, part of, refs, ref, references, reference, contributes to, follow-up to (case insensitive)\n` +
                `Note: closing keywords only auto-close issues in *this* repository — cross-repo references never auto-close, regardless of keyword.`
              );
              await addWarningLabel();
              core.warning('PR has no linked issue');
              return;
            }

            const invalidRefs = [];
            const prRefs = [];
            const validRefs = [];
            const crossRepoCloseRefs = [];
            for (const ref of refs) {
              try {
                const { data } = await github.rest.issues.get({ owner: ref.owner, repo: ref.repo, issue_number: ref.number });

                // Pull requests are also returned by the issues API; filter them out as invalid issues
                if (data.pull_request) {
                  prRefs.push(ref);
                } else {
                  validRefs.push(ref);
                  if (ref.isCrossRepo && ref.isClose) {
                    crossRepoCloseRefs.push(ref);
                  }
                }
              } catch (e) {
                // A private cross-repo target the workflow's token can't see returns 404 (repo hidden)
                // or 403 (no access); treat both as "not found" rather than failing the job. Same-repo
                // lookups only ever 404 (the token already has access to this repo), so a 403 there is a
                // real problem worth surfacing.
                if (e.status === 404 || (ref.isCrossRepo && e.status === 403)) {
                  invalidRefs.push(ref);
                } else {
                  throw e;
                }
              }
            }

            const label = ref => ref.isCrossRepo ? `${ref.owner}/${ref.repo}#${ref.number}` : `#${ref.number}`;

            const invalidLines = [
              ...invalidRefs.map(r => `- \`${label(r)}\` does not exist or is not accessible`),
              ...prRefs.map(r => `- \`${label(r)}\` is a pull request, not an issue`),
            ];

            const crossRepoCloseNote = crossRepoCloseRefs.length > 0
              ? `\n\n**Note:** ${crossRepoCloseRefs.map(r => `\`${label(r)}\``).join(', ')} ${crossRepoCloseRefs.length === 1 ? 'was' : 'were'} referenced with a closing keyword, but GitHub only auto-closes issues within the same repository. Merging this PR will **not** automatically close ${crossRepoCloseRefs.length === 1 ? 'that issue' : 'those issues'}.`
              : '';

            if (validRefs.length === 0 && invalidLines.length > 0) {
              await upsertComment(
                `${SENTINEL}\n## Invalid Issue Reference\n\n${invalidLines.join('\n')}\n\nPlease update the PR description to reference a valid issue.`
              );
              await addWarningLabel();
              core.warning(`PR has no valid issue links (not found: ${invalidRefs.map(label).join(', ') || 'none'}, pull requests: ${prRefs.map(label).join(', ') || 'none'})`);
            } else if (invalidLines.length > 0) {
              await upsertComment(
                `${SENTINEL}\n## Heads-up: Some Issue References Are Invalid\n\nThe following referenced numbers could not be validated as issues:\n${invalidLines.join('\n')}\n\nThe PR has at least one valid issue link, so no action is required — but you may want to clean up the invalid references.${crossRepoCloseNote}`
              );
              await removeWarningLabel();
              core.warning(`PR references non-issues (not found: ${invalidRefs.map(label).join(', ') || 'none'}, pull requests: ${prRefs.map(label).join(', ') || 'none'})`);
            } else if (crossRepoCloseNote) {
              await upsertComment(
                `${SENTINEL}\n## Issue Link Valid${crossRepoCloseNote}`
              );
              await removeWarningLabel();
              core.info('PR issue link is valid (cross-repo closing keyword noted)');
            } else {
              await deleteWarningComment();
              await removeWarningLabel();
              core.info('PR issue link is valid');
            }
